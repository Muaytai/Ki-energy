    <script>
      // Ensure window.fetch has both getter and setter so that iframe interceptors or extensions don't throw TypeError
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = nativeFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return _currentFetch; },
              set: function(fn) { _currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return _currentFetch; },
                set: function(fn) { _currentFetch = fn; },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (err) {
          // Graceful fallback
        }
      })();
    </script>
